function claim(c){
  if (!c) return "";
  return `<p><button class="claim" data-ids="${(c.evidence_ids || []).join(",")}" aria-expanded="false">${esc(c.claim)}</button></p><div class="basis" hidden></div>`;
}

function behaviourPane(S){
  const p = C.decision.behaviour_profile;
  if (!p) return `<p class="muted">Account profile was not captured for this case record.</p>`;
  if (p.prior_count < 3) {
    return `<div class="note">${I("info")}<div><b>Insufficient History</b>Account has only ${plural(p.prior_count, "prior transaction")} in the dataset. Behavioral anomaly scoring requires baseline history.</div></div>`;
  }
  const amt = V(S,"amount"), h = V(S,"hour_of_day"), n1 = V(S,"tx_count_1h"), ratio = amt / p.avg_amount;
  const odd = [ratio >= 3, n1 >= 3, h < p.typical_hours[0] || h > p.typical_hours[1], !!V(S,"first_transaction_to_this_beneficiary")];
  const bars = (u, n, uv, nv, cls) => {
    const m = Math.max(u, n, 1e-9);
    return `<div class="bars ${cls}"><div class="bar"><span>Baseline</span><i style="width:${Math.min(100, u/m*100)}%"></i></div><div class="bar now"><span>This Tx</span><i style="width:${Math.min(100, n/m*100)}%"></i></div></div><div class="small">${uv}<br><b>${nv}</b></div>`;
  };
  const verdict = (o, soft) => o ? `<span class="pill ${soft ? "s-mid" : "s-high"}">${soft ? "Novel Beneficiary" : "Severe Deviation"}</span>` : `<span class="pill s-low">Expected</span>`;

  return `<p class="small muted" style="margin-top:0">Sender baseline derived from ${plural(p.prior_count, "prior transfer")} since ${esc(whenStr(p.first_seen))}.</p>
    <div class="cmp">
      <div class="cmprow"><div><b>Transfer Amount</b><br>${verdict(odd[0])}</div>${bars(p.avg_amount, amt, money(p.avg_amount) + " avg", money(amt) + (ratio >= 1.5 ? ` (${ratio.toFixed(1)}x)` : ""), odd[0] ? "s-high" : "s-low")}</div>
      <div class="cmprow"><div><b>Hourly Velocity</b><br>${verdict(odd[1])}</div>${bars(p.tx_per_day / 24, n1, `${(p.tx_per_day / 24).toFixed(1)}/hr avg`, `${n1} in past hr`, odd[1] ? "s-high" : "s-low")}</div>
      <div class="cmprow"><div><b>Time Window</b><br>${verdict(odd[2])}</div><div class="small">Typical: ${p.typical_hours[0]}:00 &ndash; ${p.typical_hours[1]}:00</div><div class="small"><b>Execution: ${h}:00</b></div></div>
      <div class="cmprow"><div><b>Beneficiary Novelty</b><br>${verdict(odd[3], true)}</div><div class="small">${plural(p.distinct_receivers, "prior counterparty")}</div><div class="small"><b>${odd[3] ? "First transfer to recipient" : "Prior beneficiary"}</b></div></div>
    </div>`;
}

function networkPane(S){
  const g = C.graph || {nodes: [], edges: []};
  const accts = g.nodes.filter(n => n.kind !== "device");
  const fl = accts.filter(n => n.flagged).length;
  const dev = g.nodes.filter(n => n.kind === "device").length;
  const pats = S._patterns.map(p => (PAT[p.v.pattern] || [p.v.pattern])[0]);
  const hop = V(S,"hops_to_nearest_flagged_entity");

  const summary = `Graph Neighborhood: <b>${plural(accts.length, "account node")}</b>, of which <b>${fl}</b> are confirmed fraud entities${dev ? `, and <b>${plural(dev, "shared device")}</b>` : ""}.`
    + (pats.length ? ` Detected Typology: <span class="pill s-high">${esc(pats.join(", "))}</span>.` : "")
    + (hop != null ? ` Distance to nearest confirmed perpetrator: <b>${plural(hop, "hop")}</b>.` : "");

  return `<p class="small muted" style="margin-top:0">${summary}</p>
    <div id="cy" role="img" aria-label="Transaction graph topology around current payment"></div>
    <div class="cy-ctrls">
      <button type="button" id="cyFit">Fit View</button>
      <button type="button" id="cyReset">Reset Layout</button>
    </div>
    <p class="legend">
      <span><i class="ldot" style="background:#0F172A"></i>Current Transfer Entities</span>
      <span><i class="ldot" style="background:var(--high)"></i>Confirmed Fraud Perpetrator ${info("perp")}</span>
      <span><i class="ldot" style="background:#94A3B8"></i>Intermediary Account</span>
      <span><i class="ldot" style="background:var(--mid)"></i>Shared Device Node</span>
    </p>
    <div class="entity" id="entity"><p class="small muted" style="margin:0">Click on any account or device node to inspect adjacent connections.</p></div>`;
}

function techPane(S){
  const { alertThresh, fusedThresh } = getThresholds();
  const w = H.fusion_weights || {}, d = C.decision;
  const row = (n, v, m) => `<tr><td>${n}</td><td><b>${v}</b></td><td class="small muted">${m}</td></tr>`;
  const shap = C.evidence.filter(e => e.type === "shap"), max = Math.max(...shap.map(e => Math.abs(e.value.shap_value)), 0.001);
  const names = {triage:"Triage Agent", evidence_correlation:"Evidence Correlation Agent", supervisor_gate:"Supervisor Gate", investigation:"Investigation Narrator", supervisor_final:"Supervisor Final Gate"};
  const say = o => o.reason || (o.priority ? `Priority ${o.priority}` : "") || (o.k_hop ? `Expanded to ${plural(o.k_hop, "hop")}, collected ${o.evidence_items} items` : "") || (o.narrator ? `${o.narrator} narrator, valid=${o.valid}` : "");

  return `<p class="small muted" style="margin-top:0">Auditable signals, TreeSHAP values, and multi-agent execution telemetry (§10, §28).</p>
    <div class="tablewrap"><table class="t">
      <thead><tr><th>Signal / Metric</th><th>Value</th><th>Interpretation</th></tr></thead>
      <tbody>
        ${row("XGBoost Detection Score" + info("detection"), pct(V(S,"classifier_score")), `Supervised anomaly probability; Decision line: ${pct(alertThresh)}`)}
        ${row("Isolation Forest Behavioral Score" + info("behaviour"), pct(V(S,"behaviour_anomaly_score")), "Deviation score; &ge;60% indicates abnormal variance")}
        ${row("Graph Proximity Score" + info("network"), pct(V(S,"graph_score")), "&ge;50% indicates corroborated topological proximity")}
        ${row("Fused Multi-Signal Risk" + info("risk"), pct(d.fused_risk), `Fusion threshold: ${pct(fusedThresh)}`)}
        ${row("Supervisor Decision Confidence" + info("sure"), pct(d.confidence), "Derived from deterministic signal corroboration matrix")}
        ${w.w_classifier_score != null ? row("Logistic Fusion Weights", `w_cls=${w.w_classifier_score.toFixed(2)}, w_beh=${w.w_behaviour_score.toFixed(2)}, w_grp=${w.w_graph_score.toFixed(2)}`, "Interpretable logistic coefficients") : ""}
      </tbody>
    </table></div>

    ${shap.length ? `<details class="sub" open>
      <summary>TreeSHAP Feature Attributions (${shap.length} features analyzed)${info("drivers")}</summary>
      <div class="shap" style="margin-top:10px">${shap.map(e =>
        `<span>${esc(shapLabel(e, S))}</span>
        <div style="background:var(--soft);height:8px;border-radius:3px">
          <div class="b" style="width:${(Math.abs(e.value.shap_value)/max*100).toFixed(1)}%;background:${e.value.shap_value > 0 ? "var(--high)" : "var(--low)"}" title="${e.value.shap_value > 0 ? "Increased fraud risk" : "Decreased fraud risk"}"></div>
        </div>`).join("")}
      </div>
      <p class="legend"><span><i class="ldot" style="background:var(--high)"></i>Increased Risk</span><span><i class="ldot" style="background:var(--low)"></i>Decreased Risk</span></p>
    </details>` : ""}

    <details class="sub" id="evdetails" open>
      <summary>Curated Evidence Bundle (${C.evidence.length} discrete items)${info("evidence")}</summary>
      <div class="scroll" style="margin-top:10px">
        <table class="t">
          <thead><tr><th>ID</th><th>Type</th><th>Evidence Description</th><th>Value</th></tr></thead>
          <tbody>
            ${C.evidence.map(e => `
              <tr id="row-${e.evidence_id}">
                <td><span class="chip">${e.evidence_id}</span></td>
                <td><span class="pill s-neutral">${esc(e.type || "signal")}</span></td>
                <td>${esc(e.description.replace("SHAP: ", ""))}</td>
                <td><code>${esc(e.value === null ? "none" : typeof e.value === "object" ? (e.value.value ?? JSON.stringify(e.value)) : e.value)}</code></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </details>

    <details class="sub">
      <summary>Multi-Agent Execution Telemetry (${plural(C.agent_log.length, "step")})</summary>
      <ol class="small" style="padding-left:20px;margin-top:8px">
        ${C.agent_log.map(l => `<li><b>${names[l.agent] || l.agent}</b> <span class="muted">${l.duration_ms} ms</span><br><span class="muted">${esc(say(l.output))}</span></li>`).join("")}
      </ol>
    </details>`;
}

function decisionCard(){
  const d = C.decision, rec = recFor(C.route, d.recommended_action), done = decided(C);
  const sugg = C.route === "human_review_escalate" ? "escalate" : null;
  const opt = (k, cls, ic, t, m) => `<button class="opt ${cls}" data-d="${k}" aria-pressed="false"><span class="oi">${I(ic)}</span><span><b>${t}${sugg === k ? `<span class="tag">Recommended</span>` : ""}</b><small>${m}</small></span>${I("chevr")}</button>`;

  return `<section class="card">
    <h2><span class="step">3</span> Investigator Disposition</h2>
    <div class="sugg">
      <div class="l">Supervisor Recommendation</div>
      <div class="v">${esc(rec[0])}</div>
      <p>${esc(rec[1])}</p>
    </div>
    ${done ? outcome() : `
      <div class="opts" role="group" aria-label="Disposition Options">
        ${opt("approve", "s-high", "shield", "Confirm Fraud", "Marks transaction as verified fraud. Recipient account is indexed as a known perpetrator node for future graph detection.")}
        ${opt("escalate", "s-mixed", "up", "Escalate to Senior", "Queues case for secondary review by senior financial crimes investigator.")}
        ${opt("reject", "s-mid", "x", "Dismiss False Positive", "Closes case as benign. Recorded in calibration log to penalize false alarms.")}
      </div>
      <label class="small strong" for="note">Investigator Case Notes <span class="muted">(Optional)</span></label>
      <textarea id="note" maxlength="500" placeholder="Enter findings, evidence citations, or reasoning..."></textarea>
      <div class="counter" id="cnt">0/500</div>
      <button class="btn brand block" id="submit" style="margin-top:10px" disabled>Select Disposition Above</button>
    `}
    <p class="small muted" style="margin:12px 0 0">Human-in-the-loop guarantee: FraudInv will not block funds or alter customer status autonomously.</p>
  </section>`;
}

function outcome(){
  const lab = {approved:"Confirmed Fraud", escalated:"Escalated to Senior", rejected:"Dismissed as False Positive"}[C.reviewer_status];
  const next = {
    approved:"Case closed as verified fraud. The recipient entity has been added to the graph perpetrator index.",
    escalated:"Case escalated to senior investigator queue.",
    rejected:"Case dismissed as false alarm."
  }[C.reviewer_status];

  return `<div class="outcome">
    <div class="note tone s-go">${I("check")}<div><b>Decision Recorded: ${esc(lab)}</b><br>${esc(next)}</div></div>
    <dl>
      <dt>Investigator</dt><dd>Analyst (Session)</dd>
      <dt>Disposition Time</dt><dd>${esc(whenStr(C.reviewed_at))}</dd>
      ${C.reviewer_note ? `<dt>Case Notes</dt><dd>${esc(C.reviewer_note)}</dd>` : ""}
      <dt>Evidence Retained</dt><dd>${plural(C.evidence.length, "auditable evidence item")}</dd>
    </dl>
    <div class="actions" style="margin-top:12px">
      <button class="btn brand" id="nextCase">Next Unresolved Case ${I("chevr")}</button>
      <button class="btn" id="change">Modify Disposition</button>
    </div>
  </div>`;
}

async function showCase(id){
  markNav("review");
  $("#app").innerHTML = `<section class="card"><p class="muted" style="margin:0">Retrieving investigation dossier for Case ${esc(id)}…</p></section>`;
  try {
    C = await api(`/report/${encodeURIComponent(id)}`);
  } catch(e){
    $("#app").innerHTML = `<section class="card">
      <h2>Case Not Found</h2>
      <p class="muted">Case ${esc(id)} was not found in the active session database.</p>
      <a class="btn" href="#">Back to Queue</a>
    </section>`;
    return;
  }

  $("#app").innerHTML = renderCase();
  wireCase(id);

  api(`/related/${encodeURIComponent(C.transaction_id)}`).then(rows => {
    const el = $("#related");
    if (el) el.innerHTML = relatedHTML(rows);
  }).catch(() => {
    const el = $("#related");
    if (el) el.innerHTML = `<p class="small muted">Unable to retrieve counterparty transfer history.</p>`;
  });
}

function wireCase(id){
  document.querySelectorAll("[role=tab]").forEach(t => t.onclick = () => selectTab(t.dataset.tab));
  document.querySelectorAll(".claim").forEach(b => b.onclick = () => toggleBasis(b));
  document.querySelectorAll(".chip").forEach(b => b.onclick = e => { e.stopPropagation(); showEvidence([b.dataset.e]); });
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { selectTab(b.dataset.goto); $("#lookinto").scrollIntoView({behavior: "smooth", block: "start"}); });
  wireDecision(id);
}

function selectTab(k){
  document.querySelectorAll("[role=tab]").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === k));
  document.querySelectorAll("[role=tabpanel]").forEach(p => p.hidden = p.id !== "pane-" + k);
  if (k === "network") {
    setTimeout(() => {
      if (!cy) {
        drawGraph(C.graph);
        applyLit();
      } else {
        cy.resize();
        cy.fit();
      }
    }, 50);
  }
}

function toggleBasis(b){
  const box = b.parentElement.nextElementSibling, open = b.getAttribute("aria-expanded") === "true";
  document.querySelectorAll(".claim.on").forEach(x => {
    x.classList.remove("on");
    x.setAttribute("aria-expanded", "false");
    x.parentElement.nextElementSibling.hidden = true;
  });
  if (open) { LIT = []; applyLit(); return; }

  const ids = b.dataset.ids.split(",").filter(Boolean);
  const items = ids.map(i => C.evidence.find(e => e.evidence_id === i)).filter(Boolean);

  box.innerHTML = `<div class="muted small" style="margin-bottom:4px">Backed by verified evidence bundle items:</div>` +
    items.map(e => `<div><span>${esc(e.description.replace("SHAP: ", ""))}</span><span><b>${esc(e.value === null ? "none" : typeof e.value === "object" ? (e.value.value ?? e.value.pattern ?? "") : e.value)}</b>${chip(e.evidence_id)}</span></div>`).join("") +
    (items.some(e => e.type === "graph") ? `<div style="margin-top:6px"><button class="linkbtn small" data-show-net>Inspect in Network Graph &rarr;</button></div>` : "");

  box.hidden = false;
  b.classList.add("on");
  b.setAttribute("aria-expanded", "true");
  box.querySelectorAll(".chip").forEach(c => c.onclick = e => { e.stopPropagation(); showEvidence([c.dataset.e]); });
  box.querySelector("[data-show-net]")?.addEventListener("click", () => selectTab("network"));
  LIT = ids;
  applyLit();
}

function showEvidence(ids){
  selectTab("tech");
  const ev = $("#evdetails");
  if (ev) ev.open = true;
  document.querySelectorAll("tr.hl").forEach(r => r.classList.remove("hl"));
  ids.forEach(i => document.getElementById("row-" + i)?.classList.add("hl"));
  document.getElementById("row-" + ids[0])?.scrollIntoView({block: "center", behavior: "smooth"});
}

function applyLit(){
  if (!cy) return;
  cy.elements().removeClass("lit");
  const S = sigFromEvidence(C.evidence), snd = V(S,"sender_account"), rcv = V(S,"receiver_account"), nodes = new Set();
  LIT.map(i => C.evidence.find(e => e.evidence_id === i)).filter(Boolean).forEach(e => {
    const f = e.field;
    if (f === "sender_account" || f.startsWith("sender_") || f === "fan_out_count_window") nodes.add(snd);
    if (f === "receiver_account" || f.startsWith("receiver_") || f === "fan_in_count_window" || f === "first_transaction_to_this_beneficiary") nodes.add(rcv);
    if (f.includes("flagged")) cy.nodes("[?flagged]").forEach(n => nodes.add(n.id()));
    if (f === "shared_device_with_other_accounts") cy.nodes("[kind='device']").forEach(n => nodes.add(n.id()));
    if (f.startsWith("pattern_")) [e.value.account, e.value.collector, ...(e.value.cycle || [])].filter(Boolean).forEach(n => nodes.add(n));
    if (f === "amount" || f === "transaction_id") { nodes.add(snd); nodes.add(rcv); }
  });
  nodes.forEach(n => cy.getElementById(n).addClass("lit"));
}

function wireDecision(id){
  let choice = null;
  const note = $("#note");
  if (note) note.oninput = () => { $("#cnt").textContent = `${note.value.length}/500`; };
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    document.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    choice = b.dataset.d;
    const s = $("#submit");
    s.disabled = false;
    s.textContent = "Save Disposition: " + b.querySelector("b").firstChild.textContent;
  });

  const sub = $("#submit");
  if (sub) sub.onclick = async () => {
    sub.disabled = true;
    sub.textContent = "Saving disposition…";
    const nv = $("#note").value || null;
    try {
      const r = await api(`/review/${encodeURIComponent(id)}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision: choice, note: nv})
      });
      C.reviewer_status = r.reviewer_status;
      C.reviewed_at = r.reviewed_at;
      C.reviewer_note = nv;
      logActivity("decision", `${{approved:"Confirmed fraud", escalated:"Escalated", rejected:"Dismissed false positive"}[r.reviewer_status]} on Case ${id}`);
      $("#decide").innerHTML = decisionCard();
      wireDecision(id);
      const [st, stc] = status({route: C.route, reviewer_status: C.reviewer_status, case_id: id});
      const p = $(".case-top .pill");
      if (p) { p.className = "pill " + stc; p.textContent = st; }
      ALERTS = await api("/alerts").catch(() => ALERTS);
      updateCount();
    } catch(e){
      sub.disabled = false;
      sub.textContent = "Error saving. Retry?";
    }
  };

  const ch = $("#change");
  if (ch) ch.onclick = () => {
    const keep = C.reviewer_status;
    C.reviewer_status = "pending";
    $("#decide").innerHTML = decisionCard();
    C.reviewer_status = keep;
    wireDecision(id);
  };

  const nx = $("#nextCase");
  if (nx) nx.onclick = async () => {
    const al = await api("/alerts").catch(() => []);
    const n = al.filter(a => !decided(a) && a.case_id && a.case_id !== id).sort((x, y) => y.fused_risk - x.fused_risk)[0];
    location.hash = n ? "case=" + n.case_id : "";
  };
}

/* ======================= Cytoscape Graph & Fallback ======================= */
function drawGraph(g){
  const box = $("#cy");
  if (!box) return;
  if (!g || !g.nodes?.length) {
    box.innerHTML = `<p class="muted small" style="text-align:center;padding:40px">No topological graph data available for this transaction.</p>`;
    return;
  }

  // Graceful fallback if Cytoscape library is offline
  if (typeof cytoscape === "undefined") {
    box.innerHTML = `<div style="padding:16px;overflow:auto;max-height:380px">
      <div class="note tone s-mid">${I("info")}<div><b>Interactive Canvas Unavailable</b><br>Graph layout library could not be loaded from CDN. Displaying tabular adjacency list:</div></div>
      <table class="t"><thead><tr><th>Node ID</th><th>Role / Kind</th><th>Confirmed Fraud?</th></tr></thead><tbody>
      ${g.nodes.map(n => `<tr><td><code>${esc(n.id)}</code></td><td>${esc(n.kind || 'account')}</td><td>${n.flagged ? '<span class="pill s-high">PERPETRATOR</span>' : '<span class="pill s-low">Normal</span>'}</td></tr>`).join("")}
      </tbody></table></div>`;
    return;
  }

  try {
    if (cy) cy.destroy();
    cy = cytoscape({
      container: box,
      elements: toEls(g),
      wheelSensitivity: 0.25,
      layout: {name: "cose", animate: false, nodeRepulsion: 8000, idealEdgeLength: 75},
      style: [
        {selector: "node", style: {"background-color": "#94A3B8", label: "data(id)", "font-size": 9, color: "#475569", width: 14, height: 14, "text-valign": "bottom", "text-margin-y": 4}},
        {selector: "node[?flagged]", style: {"background-color": "#B91C1C", width: 16, height: 16}},
        {selector: "node[kind='device']", style: {"background-color": "#B45309", shape: "round-rectangle", width: 18, height: 14}},
        {selector: "node[?focus]", style: {"background-color": "#0F172A", width: 22, height: 22, "font-size": 11, "font-weight": 700, color: "#0F172A"}},
        {selector: "edge", style: {width: 1.4, "line-color": "#CBD5E1", "target-arrow-shape": "triangle", "target-arrow-color": "#94A3B8", "curve-style": "bezier", "arrow-scale": 0.8}},
        {selector: "edge[rel='USED_DEVICE']", style: {"line-style": "dashed", "line-color": "#B45309", "target-arrow-shape": "none"}},
        {selector: ".lit", style: {"border-width": 4, "border-color": "#1E3A8A", "z-index": 10}},
        {selector: "node:selected", style: {"border-width": 3, "border-color": "#0F172A"}}
      ]
    });
    cy.on("tap", "node", e => showEntity(e.target.id()));

    const fitBtn = $("#cyFit"), resetBtn = $("#cyReset");
    if (fitBtn) fitBtn.onclick = () => cy.fit();
    if (resetBtn) resetBtn.onclick = () => cy.layout({name: "cose", animate: true, nodeRepulsion: 8000, idealEdgeLength: 75}).run();
  } catch(err){
    box.innerHTML = `<p class="muted small" style="padding:20px">Graph rendering error: ${esc(err.message)}</p>`;
  }
}

function toEls(g){
  return g.nodes.map(n => ({data: {id: n.id, kind: n.kind, flagged: !!n.flagged, focus: !!n.focus}}))
    .concat(g.edges.map(e => ({data: {id: `${e.source}>${e.target}>${e.rel}`, source: e.source, target: e.target, rel: e.rel}})));
}

async function showEntity(id){
  const box = $("#entity");
  box.innerHTML = `<p class="small muted" style="margin:0">Querying details for node <code>${esc(id)}</code>…</p>`;
  let e;
  try {
    e = await api(`/entity/${encodeURIComponent(id)}`);
  } catch(err){
    box.innerHTML = `<p class="muted small">No topological metadata recorded for ${esc(id)}.</p>`;
    return;
  }

  const li = a => `<li><button class="linkbtn" data-n="${esc(a.id)}"><code>${esc(a.id)}</code></button><span>${a.flagged ? `<span class="pill s-high">Flagged Entity</span> ` : ""}${a.amount != null ? money(a.amount) + (a.count > 1 ? ` (${a.count} txs)` : "") : ""}</span></li>`;

  if (e.kind === "device") {
    box.innerHTML = `<h3>Shared Device Node: <code>${esc(e.id)}</code></h3>
      <p class="small muted" style="margin:0 0 6px">Linked to ${plural(e.account_count, "account")}.${e.account_count > 1 ? " Multi-account device sharing is an empirical indicator of synthetic mule rings." : ""}</p>
      <ul>${e.accounts.map(li).join("")}</ul>`;
  } else {
    box.innerHTML = `<h3>Account Node: <code>${esc(e.id)}</code> ${e.flagged ? `<span class="pill s-high">Confirmed Perpetrator</span>` : ""}</h3>
      <p class="small muted" style="margin:0 0 8px">Outbound: ${money(e.sent_total)} across ${plural(e.sent_count, "transfer")}; Inbound: ${money(e.received_total)} across ${plural(e.received_count, "transfer")}.${e.hops_to_flagged != null && !e.flagged ? ` Nearest fraud node is ${plural(e.hops_to_flagged, "hop")} away.` : ""}</p>
      ${e.sends_to.length ? `<div class="small strong" style="margin-top:6px">Outbound Beneficiaries</div><ul>${e.sends_to.map(li).join("")}</ul>` : ""}
      ${e.receives_from.length ? `<div class="small strong" style="margin-top:6px">Inbound Payers</div><ul>${e.receives_from.map(li).join("")}</ul>` : ""}
      ${e.devices?.filter(d => d.shared_with > 0).length ? `<div class="small strong" style="margin-top:6px">Shared Device Fingerprints</div><ul>${e.devices.filter(d => d.shared_with > 0).map(d => `<li><code>${esc(d.id)}</code> <span>shared with ${plural(d.shared_with, "other account")}</span></li>`).join("")}</ul>` : ""}
      <button class="btn outline" id="expand" style="margin-top:8px">${I("search")} Expand 1-Hop Neighbors</button>`;
  }

  box.querySelectorAll("[data-n]").forEach(b => {
    b.onclick = () => {
      if (cy) {
        const n = cy.getElementById(b.dataset.n);
        if (n.length) {
          cy.$(":selected").unselect();
          n.select();
          cy.animate({center: {eles: n}}, {duration: 250});
        }
      }
      showEntity(b.dataset.n);
    };
  });

  const ex = $("#expand");
  if (ex) ex.onclick = async () => {
    ex.disabled = true;
    ex.textContent = "Querying neighbors…";
    try {
      const g = await api(`/graph/${encodeURIComponent(id)}?k=1`);
      if (cy) {
        const add = toEls(g).filter(el => !cy.getElementById(el.data.id).length);
        cy.add(add.filter(el => !el.data.source));
        cy.add(add.filter(el => el.data.source && cy.getElementById(el.data.source).length && cy.getElementById(el.data.target).length));
        cy.layout({name: "cose", animate: false, nodeRepulsion: 8000, idealEdgeLength: 75}).run();
        applyLit();
      }
      ex.textContent = "Graph Expanded";
    } catch(err){
      ex.textContent = "Expansion failed";
    }
  };
}

        ${hist.length ? `<div class="tablewrap"><table class="t">
          <thead><tr><th>Filename</th><th>Timestamp</th><th>Rows Checked</th><th>Alerts Flagged</th><th>Action</th></tr></thead>

            <td class="small muted">${esc(whenStr(u.at))}</td>

function expectedMatch(r){
  const e = (r.expected || "").toLowerCase();
  if (!e) return null;
  const sus = ["suspicious","fraud","flag","flagged","yes","1","true"].includes(e);
  return {sus, ok: sus === r.alert};
}

function uploadResults(){
  const U = UPLOAD, R = U.results, withExp = R.filter(r => expectedMatch(r)), expSus = withExp.filter(r => expectedMatch(r).sus), expNorm = withExp.filter(r => !expectedMatch(r).sus);
  const groups = {
    all: R,
    flagged: R.filter(r => r.alert),
    clear: R.filter(r => !r.alert),
    diff: withExp.filter(r => !expectedMatch(r).ok)
  };
  const f = (k, l, cls) => `<button data-uf="${k}" aria-pressed="${UFILTER === k}" class="${cls}"><span class="dot"></span>${l} (${groups[k].length})</button>`;

  const item = r => {
    const S = sigFromAlert(r.signals), R1 = reasons(S), sev = r.alert ? severity(r.fused_risk, r.route) : {cls: "s-neutral"};
    const m = expectedMatch(r);
    const why = r.alert ? (R1[0]?.t || "Flagged by Fused Detector Risk") : `Within normal bounds (Fused Risk: ${pct(r.fused_risk)}).`;

    return `<li class="urow ${r.alert ? sev.cls : "s-neutral"}">
      <span class="rn">Row ${r.row}</span>
      <div>
        <b>${esc(why)}</b>
        <div class="small muted">${money(r.amount)} &bull; <code>${esc(r.sender)}</code> &rarr; <code>${esc(r.receiver)}</code> &bull; ${esc(whenStr(r.timestamp))}</div>
        ${r.note ? `<div class="small muted" style="margin-top:2px">${esc(r.note)}</div>` : ""}
      </div>
      <div class="r">
        ${r.alert ? `<span class="pill ${sev.cls}">Alert: ${pct(r.fused_risk)}</span>` : `<span class="pill s-low">Normal</span>`}
        ${m ? `<span class="match ${m.ok ? "ok" : "no"}">${m.ok ? "✓ Benchmark Match" : `Mismatch: expected ${m.sus ? "suspicious" : "normal"}`}</span>` : ""}
        ${r.case_id ? `<a class="linkbtn" href="#case=${esc(r.case_id)}">Open Dossier ${I("chevr")}</a>` : ""}
      </div>
    </li>`;
  };

  return `<section class="card">
    <h2>${I("check")} Evaluation Results: <code>${esc(U.filename)}</code></h2>
    <p style="margin:-4px 0 10px;font-size:15px">Ingested ${plural(U.checked, "transaction")}. <b>${U.flagged} ${U.flagged === 1 ? "alert was" : "alerts were"} triggered</b> and transferred to the review queue.</p>
    ${withExp.length ? `<p class="small muted" style="margin:0 0 12px">Benchmark Accuracy: Flagged ${expSus.filter(r => r.alert).length} of ${plural(expSus.length, "expected fraud transaction")}, passed ${expNorm.filter(r => !r.alert).length} of ${plural(expNorm.length, "normal transaction")}.</p>` : ""}
    ${U.skipped ? `<div class="note tone s-mid">${I("alert")}<div><b>${plural(U.skipped, "row")} rejected by validator:</b><br>${U.errors.map(e => `Row ${e.row}: ${esc(e.problem)}`).join("<br>")}</div></div>` : ""}
    ${U.warnings?.length ? `<div class="note">${I("info")}<div><b>Ingestion Notices:</b><br>${U.warnings.map(esc).join("<br>")}</div></div>` : ""}
    <div class="filters" role="group" aria-label="Filter results">
      ${f("all","All Rows","s-brand")}
      ${f("flagged","Flagged Alerts","s-high")}
      ${f("clear","Normal Transactions","s-low")}
      ${withExp.length ? f("diff","Benchmark Variance","s-mid") : ""}
    </div>
    ${groups[UFILTER].length ? `<ul class="ures">${groups[UFILTER].map(item).join("")}</ul>` : `<p class="muted">No transactions in selected view.</p>`}
  </section>`;
}

function showUpload(){
  markNav("upload");
  $("#app").innerHTML = uploadHTML();
  const pick = async f => {
    if (!f) return;
    UFILE = f;
    const txt = await f.text();
    UFILE._text = txt;
    UROWS = Math.max(0, txt.split(/\r?\n/).filter(l => l.trim()).length - 1);
    USTAGE = 1;
    showUpload();
  };

  $("#file").onchange = e => pick(e.target.files[0]);
  const drop = $("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); };

  const clr = $("#clear");
  if (clr) clr.onclick = () => { UFILE = null; USTAGE = 0; showUpload(); };

  const run = $("#run");
  if (run) run.onclick = async () => {
    USTAGE = 2;
    showUpload();
    $("#ustatus").innerHTML = `<div class="note tone s-brand">${I("clock")}<div><b>Processing Ingestion Pipeline</b><br>Executing feature extraction and tri-signal inference. Flagged transactions are instantiating multi-agent investigation dossiers...</div></div>`;
    try {
      UPLOAD = await api("/upload", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({filename: UFILE.name, csv_text: UFILE._text})
      });
      USTAGE = 5;
      UFILTER = "all";
      const hist = store.get("uploads", []);
      hist.unshift({...UPLOAD, at: new Date().toISOString()});
      store.set("uploads", hist.slice(0, 5));
      logActivity("upload", `Ingested ${UPLOAD.filename}: ${plural(UPLOAD.flagged, "alert")} flagged`);
      await loadHealth();
      showUpload();
      $("#uresults").scrollIntoView({behavior: "smooth"});
    } catch(e){
      let m = e.message;
      try { m = JSON.parse(m).detail; } catch(_){}
      USTAGE = 1;
      showUpload();
      $("#ustatus").innerHTML = `<div class="note tone s-high">${I("alert")}<div><b>Ingestion Error:</b> ${esc(m)}</div></div>`;
    }
  };

  document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => {
    UFILTER = b.dataset.uf;
    $("#uresults").innerHTML = uploadResults();
    showUploadWireResults();
  });
  document.querySelectorAll("[data-hist]").forEach(b => b.onclick = () => {
    UPLOAD = store.get("uploads", [])[+b.dataset.hist];
    UFILTER = "all";
    showUpload();
    $("#uresults").scrollIntoView({behavior: "smooth"});
  });
}

function showUploadWireResults(){
  document.querySelectorAll("[data-uf]").forEach(b => b.onclick = () => {
    UFILTER = b.dataset.uf;
    $("#uresults").innerHTML = uploadResults();
    showUploadWireResults();
  });
}

/* ======================= System Health & Routing ======================= */
async function loadHealth(){
  try {
    H = await api("/health");
    $("#metaDataset").innerHTML = `Dataset: <b>${esc(H.dataset || "Synthetic Benchmark")}</b>`;
    $("#liveStatus").className = "badge-live";
    $("#liveText").textContent = "System Online";
  } catch(e){
    $("#metaDataset").textContent = "Dataset: Disconnected";
    $("#liveStatus").className = "badge-live s-high";
    $("#liveText").textContent = "Offline";
  }
}

function route(){
  const h = location.hash;
  hideTip();
  if (cy) { cy.destroy(); cy = null; }
  LIT = [];
  const m = h.match(/case=([\w-]+)/);
  if (m) showCase(m[1]);
  else if (h === "#upload") showUpload();
  else if (h === "#cases") showCases();
  else if (h === "#reports") showReports();
  else if (h === "#system") showSystem();
  else showReview();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
buildShell();
loadHealth().then(route);
