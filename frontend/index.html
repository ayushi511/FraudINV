<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FraudInv — Multi-Agent Financial Fraud Detection and Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
:root{
  --bg:#F8FAFC; --panel:#FFFFFF; --ink:#0F172A; --muted:#475569; --line:#CBD5E1; --soft:#F1F5F9;
  --brand:#0F2A4A; --brand-h:#1E3A8A; --brand-bg:#EFF6FF; --brand-border:#BFDBFE;
  --go:#047857; --go-h:#065F46; --go-bg:#ECFDF5; --go-border:#A7F3D0;
  --high:#B91C1C; --high-h:#991B1B; --high-bg:#FEF2F2; --high-border:#FECACA;
  --mid:#B45309; --mid-h:#92400E; --mid-bg:#FFFBEB; --mid-border:#FDE68A;
  --low:#047857; --low-h:#065F46; --low-bg:#ECFDF5; --low-border:#A7F3D0;
  --mixed:#4F46E5; --mixed-h:#4338CA; --mixed-bg:#EEF2FF; --mixed-border:#C7D2FE;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --side:248px; --side-c:72px; --top:62px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand-h);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.muted{color:var(--muted)} .small{font-size:13px} .strong{font-weight:600}
/* ---------- shell ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);z-index:30;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;text-decoration:none;color:var(--brand)}
.brand .logo{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-h) 100%);color:#fff;box-shadow:0 2px 4px rgba(15,42,74,.2)}
.brand .sub{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0.02em;text-transform:uppercase}
.top .sep{width:1px;height:24px;background:var(--line)}
.top-meta{display:flex;align-items:center;gap:14px;font-size:13px;margin-left:auto}
.badge-live{display:inline-flex;align-items:center;gap:6px;background:var(--go-bg);border:1px solid var(--go-border);color:var(--go);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.badge-live .pulse{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 0 0 rgba(4,120,87,.4);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(4,120,87,.6)} 70%{box-shadow:0 0 0 6px rgba(4,120,87,0)} 100%{box-shadow:0 0 0 0 rgba(4,120,87,0)}}
.hamb{display:none;border:0;background:none;padding:6px;border-radius:6px;color:var(--ink)}
.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:25;transition:width .18s ease}
.side nav{display:grid;gap:4px}
.side a,.side .sbtn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border:0;background:none;width:100%;text-align:left;white-space:nowrap;overflow:hidden;transition:all .15s ease}
.side a:hover,.side .sbtn:hover{background:var(--soft);color:var(--ink)}
.side a[aria-current="page"]{background:var(--brand-bg);color:var(--brand-h);border:1px solid var(--brand-border)}
.side .count{margin-left:auto;background:var(--brand-h);color:#fff;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;line-height:18px}
.side .count:empty{display:none}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.main{margin-left:var(--side);padding:calc(var(--top) + 24px) 32px 48px;transition:margin .18s ease}
.wrap{max-width:1280px;margin:0 auto}
body.collapsed .side{width:var(--side-c)}
body.collapsed .side span,body.collapsed .side .count{display:none}
body.collapsed .side a,body.collapsed .side .sbtn{justify-content:center;padding:10px}
body.collapsed .main{margin-left:var(--side-c)}
body.collapsed #collapse .ic{transform:rotate(180deg)}
.scrim{display:none}
/* ---------- shared ---------- */
h1{font-size:24px;line-height:1.25;font-weight:700;margin:0;letter-spacing:-.015em;color:var(--ink)}
h2{font-size:16.5px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--ink)}
h3{font-size:14.5px;font-weight:600;margin:0 0 6px;color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:14px;text-decoration:none}
.back:hover{color:var(--brand-h)}
.lede{font-size:15px;color:var(--muted);margin:4px 0 0;max-width:72ch}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:8px 15px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px;color:var(--ink);transition:all .15s ease}
.btn:hover{border-color:var(--brand-h);color:var(--brand-h);background:#FAFBFD}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff} .btn.brand:hover{background:var(--brand-h);border-color:var(--brand-h);color:#fff}
.btn.go{background:var(--go);border-color:var(--go);color:#fff} .btn.go:hover{background:var(--go-h);border-color:var(--go-h);color:#fff}
.btn.outline{border-color:var(--brand-border);color:var(--brand-h);background:var(--brand-bg)} .btn.outline:hover{background:#DBEAFE}
.btn.ghost{border-color:transparent;background:none;color:var(--brand-h)} .btn.ghost:hover{background:var(--brand-bg)}
.btn.block{width:100%;justify-content:center}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-h);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.linkbtn:hover{text-decoration:underline}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:20px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;color:var(--c);background:var(--cb);border:1px solid var(--cb-line,transparent)}
.s-high{--c:var(--high);--cb:var(--high-bg);--cb-line:var(--high-border)}
.s-mid{--c:var(--mid);--cb:var(--mid-bg);--cb-line:var(--mid-border)}
.s-low{--c:var(--low);--cb:var(--low-bg);--cb-line:var(--low-border)}
.s-mixed{--c:var(--mixed);--cb:var(--mixed-bg);--cb-line:var(--mixed-border)}
.s-brand{--c:var(--brand-h);--cb:var(--brand-bg);--cb-line:var(--brand-border)}
.s-neutral{--c:var(--muted);--cb:var(--soft);--cb-line:var(--line)}
.s-go{--c:var(--go);--cb:var(--go-bg);--cb-line:var(--go-border)}
.info{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font:700 11px var(--sans);color:var(--muted);vertical-align:1px;margin-left:5px;padding:0}
.info:hover,.info[aria-expanded="true"]{border-color:var(--brand-h);color:var(--brand-h);background:var(--brand-bg)}
#tip{position:fixed;z-index:70;max-width:320px;background:#0F172A;color:#fff;font-size:13px;line-height:1.45;padding:10px 14px;border-radius:8px;pointer-events:none;box-shadow:0 8px 24px rgba(15,23,42,.35)}
.chip{border:1px solid var(--brand-border);background:var(--brand-bg);color:var(--brand-h);font:700 11.5px var(--sans);padding:2px 7px;border-radius:5px;margin-left:4px;cursor:pointer}
.chip:hover{background:#DBEAFE}
.note{display:flex;gap:12px;border:1px solid var(--line);background:var(--soft);padding:14px 16px;border-radius:10px;margin:0 0 14px}
.note.tone{border-color:var(--cb-line,var(--line));background:var(--cb)} .note.tone .ic{color:var(--c)}
.note b{display:block;margin-bottom:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:13.5px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--go);color:var(--go);font-weight:700;font-size:12.5px}
.kv{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:10px 18px;margin:0;font-size:14px}
.kv dt{color:var(--muted);font-weight:500} .kv dd{margin:0;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.hl td{background:var(--brand-bg);border-top:1px solid var(--brand-border);border-bottom:1px solid var(--brand-border)}
table.t tr:hover td{background:#FAFBFD}
.tablewrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--panel)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}
.sticky{position:sticky;top:calc(var(--top) + 20px)}
/* ---------- kpi overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.kpi .num{font-size:22px;font-weight:700;line-height:1.2;color:var(--ink)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.kpi .sub{font-size:11.5px;margin-top:4px}
/* ---------- review queue ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 15px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .15s ease}
.filters button .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.filters button:hover{background:var(--soft);color:var(--ink)}
.filters button[aria-pressed="true"]{border-color:var(--brand-border);background:var(--brand-bg);color:var(--brand-h)}
.queue{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qitem{display:grid;grid-template-columns:130px minmax(0,1fr) 210px;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:15px 20px;text-decoration:none;transition:box-shadow .15s ease,border-color .15s ease}
.qitem:hover{box-shadow:0 4px 14px rgba(15,23,42,.08);border-color:#94A3B8;border-left-color:var(--c)}
.qsev .lab{display:block;font-weight:700;font-size:13px;color:var(--c)} .qsev .num{font-size:13px;font-weight:600;color:var(--ink)}
.qhead{font-weight:700;font-size:15px;color:var(--ink)} .qwhy{font-size:13.5px;color:var(--muted);margin-top:2px} .qmeta{font-size:12.5px;color:var(--muted);margin-top:6px}
.qnext{text-align:right;display:grid;gap:6px;justify-items:end} .qnext .next{font-size:12.5px;color:var(--muted)}
.empty-state{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center;padding:12px 0}
.empty-state .art{display:grid;place-items:center;width:80px;height:80px;border-radius:50%;background:var(--brand-bg);border:1px solid var(--brand-border);color:var(--brand-h);margin-bottom:16px}
.empty-state .art .ic{width:40px;height:40px}
.empty-state .how{border-left:1px solid var(--line);padding-left:24px}
/* ---------- case page ---------- */
.case-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0 10px}
.happened{font-size:15px;color:var(--muted);margin:0 0 18px;max-width:78ch} .happened b{color:var(--ink)}
.verdict{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:stretch}
.vbox{display:flex;gap:14px;align-items:center;background:var(--cb);border:1px solid var(--cb-line);border-radius:10px;padding:16px}
.vbox .badge{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--panel);color:var(--c);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.vbox .lab{font-size:16px;font-weight:700;color:var(--c)} .vbox .num{font-size:13.5px;font-weight:600;color:var(--ink)}
.vtext p{margin:0 0 6px}
.nextstep{display:flex;gap:10px;background:var(--cb);border:1px solid var(--cb-line);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13.5px} .nextstep .ic{color:var(--c);margin-top:2px}
.reasons{list-style:none;padding:0;margin:0}
.reasons li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.reasons li:last-child{border-bottom:0}
.reasons .mk{color:var(--high);margin-top:1px} .reasons .mk.down{color:var(--low)}
.reasons .t{font-weight:600;font-size:14px} .reasons .d{font-size:13px;color:var(--muted);margin-top:2px}
.lessrisk{background:var(--low-bg);border:1px solid var(--low-border);border-radius:10px;padding:12px 16px;margin-top:14px}
.lessrisk h3{color:var(--low);display:flex;gap:6px;align-items:center;font-size:13.5px}
.lessrisk .reasons li{border-color:rgba(4,120,87,.15)}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;background:var(--panel)}
.check::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.check .q{font-size:12.5px;color:var(--muted);font-weight:500} .check .a{font-size:16px;font-weight:700;color:var(--c);margin:3px 0 4px}
.check .m{font-size:13px;color:var(--ink)} .check .n{font-size:12px;color:var(--muted);margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
.sure{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap} .sure .a{font-size:17px;font-weight:700;color:var(--c)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.dots span{padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:500} .dots span.on{background:var(--high-bg);color:var(--high);border:1px solid var(--high-border);font-weight:700}
.tablist{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 18px;flex-wrap:wrap}
.tablist button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:14px;transition:all .15s ease}
.tablist button:hover{color:var(--brand-h)}
.tablist button[aria-selected="true"]{color:var(--brand-h);border-bottom-color:var(--brand-h)}
.aihead{display:flex;align-items:center;gap:12px;background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.aihead .ic{color:var(--brand-h);width:22px;height:22px}
.found{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:18px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.report p{margin:0 0 8px;font-size:14px;line-height:1.6}
.report h4{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.report h4:first-child{margin-top:0}
.claim{background:none;border:0;padding:0;font:inherit;text-align:left;border-bottom:1px dotted var(--muted);cursor:pointer}
.claim:hover{border-bottom:1.5px solid var(--brand-h);color:var(--brand-h)} .claim.on{background:var(--brand-bg);border-radius:2px;outline:2px solid var(--brand-border)}
.inf .claim{font-style:italic}
.basis{font-size:13px;background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:8px;padding:8px 12px;margin:4px 0 12px}
.basis div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.cmp{display:grid;gap:16px}
.cmprow{display:grid;grid-template-columns:140px minmax(0,1fr) 110px;gap:14px;align-items:center}
.bars{display:grid;gap:4px;font-size:12.5px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:center}
.bar i{display:block;height:8px;border-radius:3px;background:#CBD5E1} .bar.now i{background:var(--c)}
#cy{height:400px;border:1px solid var(--line);border-radius:10px;background:#FAFBFD}
.cy-ctrls{display:flex;gap:6px;margin-top:8px}
.cy-ctrls button{padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.entity{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;font-size:13.5px}
.entity ul{list-style:none;margin:4px 0 10px;padding:0} .entity li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--soft)}
.shap{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px 14px;align-items:center;font-size:13px}
.shap .b{height:8px;border-radius:3px}
details.sub{margin-top:16px} details.sub summary{cursor:pointer;font-weight:600;font-size:14px}
.scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
/* ---------- decision panel ---------- */
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700}
.sugg{background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.sugg .l{font-size:12px;color:var(--brand-h);font-weight:700;text-transform:uppercase;letter-spacing:0.04em} .sugg .v{font-weight:700;font-size:15px;margin:2px 0 4px;color:var(--brand)} .sugg p{margin:0;font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:grid;grid-template-columns:30px 1fr 16px;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;transition:all .15s ease}
.opt:hover{border-color:#94A3B8;background:#FAFBFD}
.opt .oi{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--cb);color:var(--c)}
.opt b{display:block;font-size:14px} .opt small{font-size:12.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--brand-h);box-shadow:inset 0 0 0 1px var(--brand-h);background:#FAFBFF}
.opt .tag{font-size:11px;font-weight:700;color:var(--brand-h);background:var(--brand-bg);border:1px solid var(--brand-border);padding:1px 6px;border-radius:4px;margin-left:6px}
textarea{width:100%;min-height:80px;font:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);resize:vertical}
.counter{text-align:right;font-size:11.5px;color:var(--muted);margin-top:2px}
.outcome dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:13.5px} .outcome dt{color:var(--muted)} .outcome dd{margin:0;font-weight:600}
/* ---------- upload ---------- */
.drop{border:2px dashed #94A3B8;border-radius:12px;padding:32px 24px;text-align:center;background:#FAFBFD;transition:all .15s ease}
.drop.over{border-color:var(--brand-h);background:var(--brand-bg)}

<script>
/* ======================= basics ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null || isNaN(v) ? "–" : Math.round(Number(v) * 100) + "%";
function pctPair(v, t){
  if (v == null || isNaN(v)) return ["–", "–"];
  for (const d of [0, 1, 2, 3]) {
    const a = (Number(v) * 100).toFixed(d), b = (Number(t) * 100).toFixed(d);
    if (a !== b || d === 3) return [a + "%", b + "%"];
  }
}
const money = v => v == null || isNaN(v) ? "–" : "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const whenStr = t => {
  if (!t) return "";
  const d = new Date(String(t).replace(" ", "T"));
  return isNaN(d) ? String(t) : d.toLocaleString(undefined, {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
};
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
let H = {}, FILTER = "todo", cy = null, C = null, LIT = [], ALERTS = [], EVAL_DATA = null;

async function api(p, o){
  const r = await fetch(p, o);
  if (!r.ok) {
    let errText = "";
    try { errText = await r.text(); } catch(_){}
    throw new Error(errText || `HTTP ${r.status}`);
  }
  return r.json();
}

const store = {
  get(k, d){ try { const v = localStorage.getItem("fa:" + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("fa:" + k, JSON.stringify(v)); } catch(e){} },
};

/* Safe threshold resolver (handles LOW/HIGH vs low_confidence/high_confidence) */
function getThresholds(){
  let low = Number(H.thresholds?.LOW ?? H.low_confidence);
  let high = Number(H.thresholds?.HIGH ?? H.high_confidence);
  if (!Number.isFinite(low)) low = 0.35;
  if (!Number.isFinite(high)) high = 0.70;
  const alertThresh = Number(H.alert_threshold ?? H.thresholds?.alert_threshold ?? 0.5);
  const fusedThresh = Number(H.fused_threshold ?? H.thresholds?.fused_threshold ?? 0.5);
  return { low, high, alertThresh, fusedThresh };
}

/* ======================= icons ======================= */
const ICONS = {

  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.7-.9 1.4v.3"/><path d="M12 17h.01"/>',
  chev: '<path d="M15 6l-6 6 6 6"/>', chevr: '<path d="M9 6l6 6-6 6"/>',
  upload: '<path d="M12 15V4M7 9l5-5 5 5M5 20h14"/>', download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z"/>',
  book: '<path d="M12 6c-1.5-1.3-3.7-2-7-2v14c3.3 0 5.5.7 7 2 1.5-1.3 3.7-2 7-2V4c-3.3 0-5.5.7-7 2zM12 6v14"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  x: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  docsearch: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5"/><path d="M14 3v5h5M8 9h4M8 13h3"/><circle cx="16.5" cy="16.5" r="3"/><path d="M21 21l-2.3-2.3"/>',
  spark: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14h8M8 17h5"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bolt: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
};
const I = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;

/* ======================= shell: sidebar ======================= */
const NAV = [
  ["review", "", "shieldcheck", "Fraud Review"],
  ["cases", "cases", "cases", "All Cases"],
  ["upload", "upload", "swap", "Transactions & Ingest"],
  ["reports", "reports", "chart", "Research & Evaluation"],
  ["system", "system", "sliders", "System Architecture"]
];

function buildShell(){
  $("#nav").innerHTML = NAV.map(([k, h, ic, l]) =>
    `<a href="#${h}" data-nav="${k}" title="${l}">${I(ic)}<span>${l}</span>${k === "review" ? '<b class="count" id="navCount"></b>' : ""}</a>`
  ).join("");
  $("#helpNav").innerHTML = `${I("help")}<span>Case Reading Guide</span>`;
  const col = $("#collapse");
  const apply = c => {
    document.body.classList.toggle("collapsed", c);
    col.setAttribute("aria-expanded", String(!c));
    col.setAttribute("aria-label", c ? "Expand sidebar" : "Collapse sidebar");
    col.title = c ? "Expand sidebar" : "Collapse sidebar";
    col.innerHTML = `${I("chev")}<span>Collapse</span>`;
  };
  apply(store.get("collapsed", false));
  col.onclick = () => { const c = !document.body.classList.contains("collapsed"); store.set("collapsed", c); apply(c); };
  $("#helpNav").onclick = openGuide;
  const hamb = $("#hamb"), close = () => { document.body.classList.remove("nav-open"); hamb.setAttribute("aria-expanded", "false"); };
  hamb.onclick = () => {
    const o = !document.body.classList.contains("nav-open");
    document.body.classList.toggle("nav-open", o);
    hamb.setAttribute("aria-expanded", String(o));
  };
  $("#scrim").onclick = close;
  $("#nav").addEventListener("click", close);
}

function markNav(k){
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === k) {
      a.setAttribute("aria-current", "page");
    } else {
      a.removeAttribute("aria-current");
    }
  });
}

function logActivity(kind, text){
  const a = store.get("activity", []);
  a.unshift({kind, text, at: new Date().toISOString()});
  store.set("activity", a.slice(0, 20));
}

/* ======================= glossary + tooltips ======================= */
const G = {
  risk: ["Combined Fused Risk", "Combined probability that a transaction is fraudulent, synthesized via logistic regression or 2-of-3 deterministic fusion across XGBoost, Isolation Forest, and Graph analytics. Not fabricated by LLM."],
  detection: ["XGBoost Classifier", "Supervised gradient-boosted decision trees trained on past fraud topologies with engineered past-only temporal and behavioral features."],
  behaviour: ["Isolation Forest", "Unsupervised anomaly detector measuring the sender's deviation from their own historical transaction baseline."],
  network: ["Graph Analytics", "NetworkX graph engine evaluating k-hop proximity to known fraud accounts, fan-in/fan-out typologies, cycles, and shared device rings."],
  sure: ["Supervisor Confidence", "Deterministic confidence score derived from model signal corroboration and evidence density; never from LLM self-estimation."],
  tested: ["Empirical Calibration", "Measured on held-out chronological test partitions. Reflects observed real-world precision within each risk band."],
  perp: ["Confirmed Fraud Account", "Account confirmed as a perpetrator either from ground-truth test data or human analyst confirmation."],
  steps: ["Graph Distance (k-hop)", "Shortest path distance in the transaction graph. 1 step is direct transfer; 2 steps indicates a mutual counterparty."],
  fan_in: ["Fan-In Funnel", "Rapid multi-source aggregation: many distinct sender accounts funneling funds into a single recipient account."],
  fan_out: ["Fan-Out Dispersion", "Rapid structuring: one account dispersing funds to multiple distinct beneficiary accounts."],
  cycle: ["Circular Laundering", "Cyclic fund movement: funds routed through multiple intermediary accounts returning to origin."],
  scatter_gather: ["Scatter-Gather Ring", "Structuring typology: funds split across intermediary mule accounts and gathered into a designated collector."],
  drivers: ["TreeSHAP Feature Attribution", "Exact Shapley values explaining the additive contribution of each engineered feature toward the XGBoost detection score."],
  evidence: ["Evidence Bundle (E1...E38)", "Discrete, structured evidence items curated by the Evidence Correlation Agent, providing a verifiable audit trail."],
  summary: ["Mechanical Grounding Validation", "Mechanical validator checks that 100% of claims and figures cited in the LLM narration match the curated evidence bundle."],
  priority: ["Priority Routing", "P1: Strong multi-signal corroboration. P2: Standard single/dual signal alert. P3: Low-confidence/exploratory alert."],
  mixed: ["Conflicting Signals", "Classifier detected anomaly while behavioural/graph detectors indicate normal behavior. Triggers unassisted human review."],
  further: ["Widen Search (k=3)", "Medium confidence alert where the supervisor autonomously widened the graph radius from 2 to 3 hops."],
  alertline: ["Detection Threshold", "Calibrated decision threshold balancing precision and recall to control investigator alert budget."],
};

function info(k){
  return G[k] ? `<button class="info" type="button" data-tip="${k}" aria-label="Explanation for ${esc(G[k][0])}">i</button>` : "";
}

function showTip(btn){
  const t = $("#tip"), [title, body] = G[btn.dataset.tip] || ["Info", ""];
  t.innerHTML = `<b>${esc(title)}</b><br>${esc(body)}`;
  t.hidden = false;
  const r = btn.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width/2 - w/2), innerWidth - w - 8);
  let y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = r.top - h - 8;
  t.style.left = x + "px"; t.style.top = y + "px";
  btn.setAttribute("aria-expanded", "true");
}

function hideTip(){
  $("#tip").hidden = true;
  document.querySelectorAll(".info[aria-expanded]").forEach(b => b.removeAttribute("aria-expanded"));
}

document.addEventListener("mouseover", e => { const b = e.target.closest(".info"); if (b) showTip(b); });
document.addEventListener("mouseout", e => { if (e.target.closest(".info")) hideTip(); });
document.addEventListener("focusin", e => { const b = e.target.closest(".info"); if (b) showTip(b); else hideTip(); });
document.addEventListener("click", e => {
  const b = e.target.closest(".info");
  if (b) {
    e.preventDefault(); e.stopPropagation();
    b.hasAttribute("aria-expanded") ? hideTip() : showTip(b);
  } else {
    hideTip();
  }
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });

function openGuide(){
  const d = $("#guide");
  const gs = (n, cls, t, m) => `<div class="gstep ${cls}"><span class="n">${n}</span><div><b>${t}</b><span class="small muted">${m}</span></div></div>`;
  d.innerHTML = `<button class="xbtn" aria-label="Close" onclick="this.closest('dialog').close()">${I("x")}</button>
    <h2 id="guide-h" style="font-size:20px">${I("book")} FraudInv Investigation Workflow</h2>
    <p class="muted" style="margin:0 0 16px">How FraudInv correlates multi-agent evidence and assists investigator decision-making:</p>
    <div class="guide-steps">
      ${gs(1, "s-brand", "Factual Ingestion", "Verifies transaction details: amount, sender, receiver, timestamp, and device fingerprint.")}
      ${gs(2, "s-go", "Tri-Signal Detection", "Calculates XGBoost classifier score, Isolation Forest behavioral score, and Graph Network score.")}
      ${gs(3, "s-mixed", "Deterministic Fusion", "Fuses signals via learned logistic regression or 2-of-3 voting. Evaluates signal agreement.")}
      ${gs(4, "s-mid", "Multi-Agent Narrative & Review", "Curates evidence bundle, generates mechanically grounded narrative, and routes to analyst.")}
    </div>
    <h3>Core Verification Principles</h3>
    <dl>${["risk","detection","behaviour","network","sure","tested","perp","steps","fan_in","fan_out","cycle","scatter_gather","summary","evidence","drivers","mixed","further","priority"]
      .map(k => `<dt>${esc(G[k][0])}</dt><dd style="margin:0">${esc(G[k][1])}</dd>`).join("")}</dl>
    <div style="margin-top:20px;display:flex;justify-content:space-between;align-items:center">
      <span class="small muted">FraudInv never auto-blocks transactions. Human investigators always retain final decision authority.</span>
      <button class="btn brand" onclick="this.closest('dialog').close()">Close Guide</button>
    </div>`;
  d.showModal();
}

/* ======================= signal interpretation ======================= */
function sigFromEvidence(ev){
  const S = {_patterns: []};
  ev.forEach(e => {
    if (e.field.startsWith("pattern_")) S._patterns.push({v: e.value, id: e.evidence_id});
    else S[e.field] = {v: e.value, id: e.evidence_id};
  });
  return S;
}

function sigFromAlert(sig){
  const S = {_patterns: []};
  Object.entries(sig || {}).forEach(([f, v]) => {
    if (f.startsWith("pattern_")) S._patterns.push({v, id: null});
    else S[f] = {v, id: null};
  });
  return S;
}

const V = (S, f) => S[f]?.v;

const PAT = {
  fan_in: ["Fan-In Funnel Typology", p => `${p.distinct_senders} distinct accounts funneled funds into recipient within 3 days. Typology: money collection.`],
  fan_out: ["Fan-Out Dispersion Typology", p => `Account dispersed funds to ${p.distinct_receivers} distinct beneficiaries within 3 days. Typology: structuring.`],
  cycle: ["Circular Laundering Loop", p => `Funds traversed through ${p.length} intermediary accounts and returned to origin. Typology: obfuscation.`],
  scatter_gather: ["Scatter-Gather Dispersion", p => `Funds routed through ${p.intermediaries} intermediate accounts before reconverging. Typology: layering.`],
};

function reasons(S){
  const R = [], th = getThresholds().alertThresh, add = (w, t, d, ...f) => R.push({w, t, d, ids: f.map(x => S[x]?.id).filter(Boolean)});
  S._patterns.forEach(p => { const P = PAT[p.v.pattern]; if (P) R.push({w: 10, t: P[0], d: P[1](p.v), ids: [p.id].filter(Boolean), tip: p.v.pattern}); });
  if (V(S,"receiver_is_flagged")) add(9, "Receiver is a Known Fraud Perpetrator", "The recipient account was previously confirmed as a fraudulent perpetrator.", "receiver_is_flagged");
  if (V(S,"sender_is_flagged")) add(8, "Sender is a Known Fraud Perpetrator", "The sending account was previously confirmed in historical fraud investigations.", "sender_is_flagged");
  if ((V(S,"shared_device_with_other_accounts") || 0) >= 2) add(7, "Device Shared Across Multiple Accounts", `Originating device linked to ${V(S,"shared_device_with_other_accounts")} other accounts. Typology: mule syndicate.`, "shared_device_with_other_accounts");
  if ((V(S,"amount_to_avg_ratio") || 0) >= 3) add(7, "Abnormal Amount Elevation", `Transaction amount is ${Number(V(S,"amount_to_avg_ratio")).toFixed(1)}x greater than sender's historical average.`, "amount_to_avg_ratio");
  if ((V(S,"receiver_connected_to_flagged_accounts") || 0) > 0) add(6, "Proximity to Confirmed Fraud Syndicate", `${plural(V(S,"receiver_connected_to_flagged_accounts"), "known fraud account")} identified within ${V(S,"k_hop") ?? 2} hops.`, "receiver_connected_to_flagged_accounts");
  if ((V(S,"burst_10min") || 0) >= 3) add(6, "High-Frequency Burst Activity", `${V(S,"burst_10min")} transactions originated from sender within a 10-minute window.`, "burst_10min");
  else if ((V(S,"tx_count_1h") || 0) >= 3) add(5, "Elevated Hourly Velocity", `${V(S,"tx_count_1h")} transactions executed by sender within the past hour.`, "tx_count_1h");
  if ((V(S,"fan_in_count_window") || 0) >= 6 && !S._patterns.some(p => p.v.pattern === "fan_in")) add(5, "Recipient Concentration Velocity", `${V(S,"fan_in_count_window")} unique accounts transferred funds to this recipient in 72h.`, "fan_in_count_window");
  if ((V(S,"classifier_score") ?? 0) >= th) add(5, "Supervised Model Match", `XGBoost classifier flagged fraud pattern with confidence ${pct(V(S,"classifier_score"))} (threshold: ${pct(th)}).`, "classifier_score");
  if (V(S,"device_changed")) add(4, "Sender Device Switch Detected", "Transaction executed from an unobserved device fingerprint.", "device_changed");
  if (V(S,"first_transaction_to_this_beneficiary")) add(3, "First Transfer to Beneficiary", "No prior transactional history between sender and recipient.", "first_transaction_to_this_beneficiary");
  const h = V(S,"hour_of_day"); if (h != null && h < 6) add(2, "Off-Hours Execution", `Transaction initiated during off-hours (${String(h).padStart(2,"0")}:00 local time).`, "hour_of_day");
  return R.sort((a, b) => b.w - a.w);
}

function riskRange(risk){
  const { low, high } = getThresholds();
  if (risk < low) return {cls:"s-low", lab:"Low Risk", mean:"Combined risk is below the calibrated review threshold."};
  if (risk > high) return {cls:"s-high", lab:"High Risk", mean:"Combined risk exceeds high-confidence priority threshold."};
  return {cls:"s-mid", lab:"Medium Risk", mean:"Combined risk is in the intermediate zone requiring corroboration."};
}

function severity(risk, route){
  if (route === "human_review_raw_evidence") {
    return {cls:"s-mixed", lab:"Conflicting Signals", mean:"Detector signals conflict; manual inspection of unassisted evidence required.", tip:"mixed", icon:"alert"};
  }
  const range = riskRange(risk);
  return {...range, icon: range.cls === "s-high" ? "alert" : "info"};
}

function status(a){
  const rs = a.reviewer_status;
  if (rs === "approved") return ["Confirmed Fraud", "s-high"];
  if (rs === "rejected") return ["False Positive", "s-low"];
  if (rs === "escalated") return ["Escalated to Senior", "s-mid"];
  if (!a.case_id) return ["Not Investigated", "s-neutral"];
  return ({
    human_review_escalate: ["Pending Senior Review", "s-brand"],
    human_review_needs_more_evidence: ["Expanded Graph Search (k=3)", "s-mid"],
    human_review_raw_evidence: ["Conflicting Signals", "s-mixed"]
  })[a.route] || ["Pending Review", "s-neutral"];
}

const decided = a => ["approved","rejected","escalated"].includes(a.reviewer_status);

const REC = {
  escalate_for_review: ["Escalate for Senior Review", "Multiple independent detectors agree and report claims are mechanically grounded in evidence."],
  request_more_evidence: ["Expand Investigation Context", "Intermediate signals detected. Graph search radius was autonomously widened to 3 hops."],
  monitor: ["Continue Monitoring", "Risk indicators remain below priority threshold. Log for behavioral tracking."],
  raw: ["Evaluate Raw Signal Evidence", "Model signals conflict. LLM narrative suppressed to prevent bias. Review raw indicators directly."],
};

function recFor(route, action){
  return route === "human_review_raw_evidence" ? REC.raw : route === "human_review_needs_more_evidence" ? REC.request_more_evidence : (REC[action] || REC.escalate_for_review);
}

function calibration(risk){
  const cal = H.calibration;
  if (!cal) return null;
  const table = cal.alert_calibration?.reliability_table || [];
  const b = table.find(b => risk >= b.min && (risk < b.max || (b.max >= 1 && risk <= b.max)));
  if (!b || b.alerts < 10 || b.real_rate == null) {
    return {text: "Calibration note: Sample size in this risk partition is limited for empirical rate estimation."};
  }
  const n = Math.round(b.real_rate * 10);
  return {
    text: n >= 10 ? "Empirical validation: Nearly 100% of test cases in this risk band corresponded to verified fraud."
      : n <= 0 ? "Empirical validation: Fewer than 1 in 10 test alerts in this risk band corresponded to fraud."
      : `Empirical validation: Approximately ${n} in 10 test alerts in this risk band corresponded to verified fraud.`
  };
}

function shapLabel(e, S){
  const f = e.field.replace("shap_", ""), v = e.value.value;
  if (f.startsWith("type_")) return `Payment Channel ${v ? "==" : "!="} ${f.slice(5).replaceAll("_", " ").toUpperCase()}`;
  if (f === "log_amount") return `Transfer Magnitude (${money(V(S, "amount"))})`;
  return `${e.description.replace("SHAP: ", "")} (${v == null ? "–" : Number(v).toFixed(2)})`;
}

const chip = id => id ? `<button class="chip" data-e="${id}" aria-label="Inspect evidence ${id}" title="Click to view evidence in audit trail">${id}</button>` : "";
const headlineFor = a => {
  const R = reasons(sigFromAlert(a.signals));
  return !a.case_id ? "Pending Investigation" : R[0]?.t || "Flagged by Fused Detector Risk";
};

/* ======================= Overview & Fraud Review ======================= */
function groupsOf(al){
  const open = al.filter(a => !decided(a));
  const { high } = getThresholds();
  return {
    todo: open,
    urgent: open.filter(a => a.fused_risk > high && a.route !== "human_review_raw_evidence"),
    further: open.filter(a => a.route === "human_review_needs_more_evidence"),
    mixed: open.filter(a => a.route === "human_review_raw_evidence"),
    done: al.filter(decided)
  };
}

function overviewKpis(al){
  const s = H.session || {};
  const totalChecked = s.transactions_checked || (H.history_rows ? Math.min(H.history_rows, 100000) : al.length);
  const totalAlerts = s.alerts ?? al.length;
  const pendingCases = al.filter(a => !decided(a)).length;
  const confirmedFraud = al.filter(a => a.reviewer_status === "approved").length;
  const falsePositives = al.filter(a => a.reviewer_status === "rejected").length;
  const { alertThresh, fusedThresh } = getThresholds();

  return `<div class="kpis">
    <div class="kpi"><div class="num">${Number(totalChecked).toLocaleString()}</div><div class="lbl">Transactions Ingested</div><div class="sub muted">Real-time simulated stream</div></div>
    <div class="kpi"><div class="num" style="color:var(--brand-h)">${totalAlerts}</div><div class="lbl">Flagged Alerts</div><div class="sub muted">Threshold: &ge; ${pct(alertThresh)}</div></div>
    <div class="kpi"><div class="num" style="color:var(--mid)">${pendingCases}</div><div class="lbl">Active Investigation Queue</div><div class="sub muted">Awaiting analyst action</div></div>
    <div class="kpi"><div class="num" style="color:var(--high)">${confirmedFraud}</div><div class="lbl">Confirmed Fraud</div><div class="sub muted">Added to graph perpetrator index</div></div>
    <div class="kpi"><div class="num" style="color:var(--low)">${falsePositives}</div><div class="lbl">False Positives Dismissed</div><div class="sub muted">Triage fusion line: ${pct(fusedThresh)}</div></div>
  </div>`;
}

function activityHTML(){
  const a = store.get("activity", []).slice(0, 5);

  return `<section class="card" style="margin-top:20px">

function queueItem(a){
  const S = sigFromAlert(a.signals), R = reasons(S), sev = severity(a.fused_risk, a.route), [st, stc] = status(a);
  const why = !a.case_id ? "Awaiting investigation run." : R.length > 1 ? `Corroborating: ${R[1].t.toLowerCase()}${R.length > 2 ? `, +${R.length - 2} more` : ""}.` : "";
  const next = (a.route === "human_review_raw_evidence" ? REC.raw : a.route === "human_review_needs_more_evidence" ? REC.request_more_evidence : REC.escalate_for_review)[0];
  return `<li><a class="qitem ${sev.cls}" href="#case=${esc(a.case_id || "")}" ${a.case_id ? "" : `data-tx="${esc(a.transaction_id)}"`}>
    <div class="qsev">
      <span class="lab">${sev.lab}</span>
      <span class="num">Fused Risk ${pct(a.fused_risk)}</span>
    </div>
    <div>
      <div class="qhead">${esc(headlineFor(a))}</div>
      ${why ? `<div class="qwhy">${esc(why)}</div>` : ""}
      <div class="qmeta"><b>${money(a.amount)}</b> &bull; Sender: <code>${esc(a.sender)}</code> &rarr; Recipient: <code>${esc(a.receiver)}</code> &bull; ${esc(whenStr(a.timestamp))}</div>
    </div>
    <div class="qnext">
      <span class="pill ${stc}">${st}</span>
      ${decided(a) ? "" : `<span class="next">${esc(next)}</span>`}
    </div>
  </a></li>`;
}

  try {

    return;

  updateCount();

  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { FILTER = b.dataset.f; showReview(); });

async function investigate(tx){

  else {
    $("#app").innerHTML = `<section class="card">
      <h2>Investigation Filtered by Triage</h2>
      <p>The Triage Agent determined that this transaction does not meet investigation criteria: ${esc(r.reason)}.</p>
      <a class="btn" href="#">Back to Cases</a>
    </section>`;
  }
}

let CQ = "", C_SORT = "created_desc", C_STATUS = "all", C_PRIORITY = "all";

function casesHTML(al){
  let rows = al.filter(a => a.case_id);
  const q = CQ.trim().toLowerCase();
  if (q) {
    rows = rows.filter(a => [a.case_id, a.sender, a.receiver, a.transaction_id, headlineFor(a)].join(" ").toLowerCase().includes(q));
  }
  if (C_STATUS !== "all") {
    if (C_STATUS === "pending") rows = rows.filter(a => !decided(a));
    else rows = rows.filter(a => a.reviewer_status === C_STATUS);
  }
  if (C_PRIORITY !== "all") {
    rows = rows.filter(a => a.priority === C_PRIORITY);
  }

  rows.sort((x, y) => {
    if (C_SORT === "risk_desc") return y.fused_risk - x.fused_risk;
    if (C_SORT === "risk_asc") return x.fused_risk - y.fused_risk;
    if (C_SORT === "amount_desc") return (y.amount || 0) - (x.amount || 0);
    return String(y.created_at || "").localeCompare(String(x.created_at || ""));
  });

  return `<div class="page-head">
      <div>
        <h1>All Investigation Cases</h1>
        <p class="lede">Comprehensive repository of all alerted and investigated transactions across the active session.</p>
      </div>
      <div class="actions">
        <label class="btn" style="cursor:text;padding:6px 12px">
          ${I("search")}

        <select id="cSort" class="btn" style="padding:7px 12px" aria-label="Sort cases">
          <option value="created_desc" ${C_SORT==="created_desc"?"selected":""}>Newest First</option>
          <option value="risk_desc" ${C_SORT==="risk_desc"?"selected":""}>Highest Risk</option>
          <option value="risk_asc" ${C_SORT==="risk_asc"?"selected":""}>Lowest Risk</option>
          <option value="amount_desc" ${C_SORT==="amount_desc"?"selected":""}>Highest Amount</option>
        </select>
        <select id="cStatus" class="btn" style="padding:7px 12px" aria-label="Filter status">
          <option value="all" ${C_STATUS==="all"?"selected":""}>All Statuses</option>
          <option value="pending" ${C_STATUS==="pending"?"selected":""}>Pending Review</option>
          <option value="approved" ${C_STATUS==="approved"?"selected":""}>Confirmed Fraud</option>
          <option value="rejected" ${C_STATUS==="rejected"?"selected":""}>False Positive</option>
          <option value="escalated" ${C_STATUS==="escalated"?"selected":""}>Escalated</option>
        </select>
      </div>
    </div>
    ${rows.length ? `<div class="tablewrap"><table class="t">
      <thead>
        <tr>
          <th>Case ID</th>
          <th>What Happened (Tri-Signal Reasoning)</th>
          <th>Priority</th>
          <th>Fused Risk</th>
          <th>Decision Status</th>
          <th>Amount</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
      ${rows.map(a => {
        const [st, stc] = status(a), sev = severity(a.fused_risk, a.route);
        return `<tr>
          <td><a class="linkbtn" href="#case=${esc(a.case_id)}"><code>${esc(a.case_id)}</code></a></td>

            <div class="strong">${esc(headlineFor(a))}</div>

          </td>
          <td><span class="pill s-neutral">${esc(a.priority || "P2")}</span></td>

          <td><span class="pill ${stc}">${st}</span></td>
          <td class="strong">${money(a.amount)}</td>

      <p class="small muted" style="margin-top:10px;text-align:right">Showing ${rows.length} of ${al.filter(a => a.case_id).length} investigated cases.</p>`
      : `<section class="card" style="text-align:center"><p class="muted" style="margin:0">${al.length ? "No cases match the filter criteria." : "No investigated cases in database."}</p></section>`}`;

          <tr>
            <th>Model Architecture</th>
            <th>Precision</th>

        </tbody>
      </table></div>` : `<p class="muted">Calibration data is being refreshed.</p>`}

function checksCard(S){
  const { alertThresh } = getThresholds();
  const c = V(S,"classifier_score") ?? 0, b = V(S,"behaviour_anomaly_score") ?? 0, g = V(S,"graph_score") ?? 0;
  const p = C.decision.behaviour_profile, w = H.fusion_weights || {}, bUntrusted = w.w_behaviour_score != null && w.w_behaviour_score <= 0;

  const det = c >= Math.max(0.85, alertThresh) ? ["s-high","High Suspicion","Strong alignment with historical fraud topologies."]
    : c >= alertThresh ? ["s-mid","Above Threshold","Exceeds calibrated detection threshold."]
    : ["s-low","Normal Pattern","Consistent with legitimate activity."];

  const noHist = p && p.prior_count < 3;
  const beh = noHist ? ["s-neutral","Insufficient History","Fewer than 3 prior transactions observed for account."]
    : b >= 0.6 ? ["s-high","Severe Deviation","Extreme divergence from sender's historical baseline."]
    : b >= 0.3 ? ["s-mid","Moderate Deviation","Slight behavioral anomaly detected."]
    : ["s-low","Normal Behavior","Aligned with baseline behavior."];

  const pats = S._patterns.length, flagged = V(S,"receiver_is_flagged") || V(S,"sender_is_flagged"), near = V(S,"receiver_connected_to_flagged_accounts") || 0;
  const net = g >= 0.5 ? ["s-high","High Graph Proximity", flagged ? "Direct link to confirmed fraud perpetrator." : pats ? "Part of verified laundering typology." : "Proximity to fraud accounts."]
    : g > 0 ? ["s-mid","Weak Proximity", near ? `${plural(near, "fraud account")} within 2 hops.` : "Peripheral link."]
    : ["s-low","No Suspicious Links","No topological connection to known syndicates."];

  const card = ([cls, a, m], q, k, n, extra = "") => `<div class="check ${cls}"><div class="q">${q}${info(k)}</div><div class="a">${a}</div><div class="m">${m}</div>${extra}<div class="n">${n}</div></div>`;
  return `<section class="card">
    <h2>The Tri-Signal Detectors</h2>
    <div class="checks">
      ${card(det, "XGBoost Classifier", "detection", `Score: ${pct(c)} (Cutoff: ${pct(alertThresh)})${chip(S.classifier_score?.id)}`)}
      ${card(beh, "Isolation Forest (Behavior)", "behaviour", `Anomaly Score: ${pct(b)}${chip(S.behaviour_anomaly_score?.id)}`, bUntrusted ? `<div class="n muted">Signal weight is non-positive; ignored in fusion.</div>` : "")}
      ${card(net, "Graph Analytics Engine", "network", `Graph Score: ${pct(g)}${chip(S.graph_score?.id)}`)}
    </div>
  </section>`;
}

function typesOf(){
  const d = C.decision;
  let t = d.corroborating_types;
  if (!t) {
    const x = C.evidence.find(e => e.field === "corroborating_evidence_count")?.description.split(": ")[1] || "";
    t = x && x !== "none" ? x.split(", ") : [];
  }
  return t;
}

function confidenceStatus(conf, route){
  if (route === "human_review_escalate") return ["s-high", "High Confidence", "Corroborated by multiple independent signals."];
  const { low, high } = getThresholds();
  if (conf < low) return ["s-low", "Low Confidence", "Limited corroborating evidence available."];
  if (conf >= high) return ["s-high", "High Confidence", "Meets high-confidence escalation threshold."];
  return ["s-mid", "Intermediate Confidence", "Evidence warrants analyst review."];
}

function sureCard(S){
  const d = C.decision, conf = d.confidence, conflicting = V(S,"signals_conflicting"), types = typesOf();
  const names = {model:"Classifier Model", behaviour:"Behavioral Anomaly", graph:"Network Topology", historical:"Historical Velocity"};
  const [cls, a, m] = conflicting
    ? ["s-mixed","Conflicting Detector Signals", `${esc(d.conflict_reason || "Individual detectors returned divergent assessments")}. Unassisted raw evidence review active.`]
    : confidenceStatus(conf, C.route);

  return `<section class="card ${cls}">
    <h2>Supervisor Confidence & Alignment${info("sure")}</h2>
    <div class="sure"><span class="a">${a}</span><span class="muted small">Fusion Confidence: <b>${pct(conf)}</b></span></div>
    <p style="margin:6px 0 0;font-size:13.5px">${m}</p>
    <div class="dots">${Object.entries(names).map(([k, n]) => `<span class="${types.includes(k) ? "on" : ""}">${types.includes(k) ? "✓ " : ""}${n}</span>`).join("")}</div>
  </section>`;
}

function reportPane(S, R){
  const r = C.report, p = C.decision.behaviour_profile, amt = V(S,"amount");
  const found = `<div class="found"><dl class="kv">
      <dt>Primary Warning</dt><dd><b>${esc(R[0]?.t || "Fused Multi-Signal Anomaly")}</b></dd>
      <dt>Transaction Amount</dt><dd>${money(amt)} (${esc(V(S,"transaction_type") || "TRANSFER")})</dd>
      <dt>Historical Comparison</dt><dd>${p && p.prior_count >= 3 ? `${(amt / p.avg_amount).toFixed(1)}x sender average of ${money(p.avg_amount)}` : "Baseline data insufficient"}</dd>
      <dt>Recipient Account</dt><dd>${V(S,"receiver_is_flagged") ? "<span class='pill s-high'>Known Fraud Perpetrator</span>" : V(S,"first_transaction_to_this_beneficiary") ? "First-time transfer" : "Previously transacted"}</dd>
      <dt>Supervisor Confidence</dt><dd><span class="pill ${V(S,"signals_conflicting") ? "s-mixed" : confidenceStatus(C.decision.confidence, C.route)[0]}">${V(S,"signals_conflicting") ? "Conflicting Signals" : pct(C.decision.confidence)}</span>${info("sure")}</dd>
    </dl>
    <div>
      <h3 style="margin-top:0">Key Supporting Evidence</h3>
      ${R.length ? `<ul class="small" style="padding-left:18px;margin:0;display:grid;gap:6px">${R.slice(0, 4).map(x => `<li><b>${esc(x.t)}:</b> <span class="muted">${esc(x.d)}</span></li>`).join("")}</ul>` : `<p class="muted small">No specific anomaly identified.</p>`}
    </div>
  </div>`;

  const related = `<h3 style="margin-top:22px">Counterparty Transaction Context</h3>
    <p class="small muted" style="margin:0 0 10px">Historical transfers involving sender or recipient up to the current timestamp.</p>
    <div id="related"><p class="small muted">Loading counterparty transactions…</p></div>`;

  const head = (badge, cls) => `<div class="aihead">
    ${I("spark")}
    <div style="flex:1">
      <b>Investigation Report</b> <span class="pill ${cls}">${badge}</span>${info("summary")}
      <div class="small muted">Synthesized by ${esc(C.narrator)} Narrator &bull; Generated: ${esc(whenStr(C.created_at))}</div>
    </div>
  </div>`;

  if (!r) {
    const mixed = V(S,"signals_conflicting");
    return head("Suppressed (Divergent Signals)", "s-mixed") +
      `<div class="note tone s-mixed">${I("alert")}<div><b>Narrative Suppressed by Supervisor</b><br>${mixed ? "Detector signals conflict with one another" : "Evidence density is below narrative threshold"}. The system suppressed automatic narration to prevent investigator bias. Inspect the raw indicators directly.</div></div>` +
      found + related;
  }

  const part = (t, xs, cls = "") => xs?.length ? `<h4>${t}</h4><div class="${cls}">${xs.map(claim).join("")}</div>` : "";
  const gr = C.validation?.grounding_rate;
  const groundingBadge = gr != null ? (Math.round(gr * 100) === 100 ? "100% Citation Grounded" : `${Math.round(gr * 100)}% Citation Grounded`) : "Unverified Narrative";

  return head(groundingBadge, "s-go") + found +
    `<p class="small muted" style="margin:0 0 10px">Click any cited claim to inspect its backing evidence in the bundle.</p>
    <div class="report">
      <h4>Detection Rationale</h4>${claim(r.alert_reason)}
      <h4>Transaction Summary</h4>${claim(r.transaction_summary)}
      ${part("Behavioral Deviation", r.behavioural_findings)}
      ${part("Network Topology Observations", r.network_findings)}
      ${part("Attribution Explanations", r.model_explanation)}
      ${part("Investigator Inference", r.inference, "inf")}
      ${r.insufficient_evidence?.length ? `<h4>Data Limitations & Gaps</h4>${r.insufficient_evidence.map(x => `<p class="muted small">&bull; ${esc(x)}</p>`).join("")}` : ""}
    </div>` + related;
}

function relatedHTML(rows){
  if (!rows.length) return `<p class="small muted">No prior transactions found in history window.</p>`;
  return `<div class="tablewrap"><table class="t">
    <thead>
      <tr><th>Timestamp</th><th>Amount</th><th>Sender</th><th>Recipient</th><th>Channel</th><th>Status</th></tr>
    </thead>
    <tbody>
      ${rows.map(r => `<tr class="${r.this ? "hl" : ""}">
        <td class="small muted">${esc(whenStr(r.timestamp))}</td>
        <td><b>${money(r.amount)}</b></td>
        <td><code>${esc(r.sender)}</code></td>
        <td><code>${esc(r.receiver)}</code></td>
        <td class="small muted">${esc(r.type || "TRANSFER")}</td>
        <td>${r.this ? `<span class="pill s-brand">Current Tx</span>` : r.alerted ? `<span class="pill s-high">Flagged</span>` : `<span class="pill s-low">Normal</span>`}</td>
